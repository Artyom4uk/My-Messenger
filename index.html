<!DOCTYPE html>
<html>
<head>
    <title>Чат с именами</title>
    <meta charset="utf-8">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #121212; color: white; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 10px; border: none; font-size: 16px; }
        input { background: #2a2a2a; color: white; }
        button { background: #3b82f6; color: white; cursor: pointer; }
        .message { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 12px; }
        #chat { display: none; }
        #error { color: #ff6b6b; margin-top: 10px; }
        #regNameBlock { display: none; }
    </style>
</head>
<body>

<h1>💬  Мой чат</h1>
<button id="downloadBtn" style="background:#10b981;">📥 Скачать .exe</button>
<hr>

<div id="auth">
    <h3>Вход / Регистрация</h3>
    
    <div id="regNameBlock">
        <input type="text" id="regName" placeholder="Ваше имя (будет видно в чате)">
    </div>
    
    <input type="email" id="email" placeholder="Email (для входа)">
    <input type="password" id="password" placeholder="Пароль">
    
    <button id="showRegBtn">Нет аккаунта? Зарегистрироваться</button>
    <button id="registerBtn" style="display:none;">Зарегистрироваться</button>
    <button id="loginBtn">Войти</button>
    <div id="error"></div>
    
    <hr>
    <div style="text-align: center;">
        <button id="googleBtn" style="background:#db4437;">Войти через Google</button>
    </div>
</div>

<div id="chat">
    <button id="logoutBtn" style="background:#ef4444;">Выйти</button>
    <div id="messages" style="max-height: 400px; overflow-y: auto; margin: 20px 0;"></div>
    <input type="text" id="messageInput" placeholder="Сообщение...">
    <button id="sendBtn">Отправить</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // ===== ТВОЙ КОНФИГ Firebase =====
    const firebaseConfig = {
        apiKey: "AIzaSyBsS0KGNIdTvnJ36ud1lVjDRlEQF1UhZfA",
        authDomain: "my-akgo-chat.firebaseapp.com",
	databaseURL: "https://my-akgo-chat-default-rtdb.firebaseio.com",
        projectId: "my-akgo-chat",
        storageBucket: "my-akgo-chat.firebasestorage.app",
        messagingSenderId: "1041994309787",
        appId: "1:1041994309787:web:f984a589d23cc612c7a63e"
    };
    // =============================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const authDiv = document.getElementById('auth');
    const chatDiv = document.getElementById('chat');
    const errorDiv = document.getElementById('error');

    // Показываем поле для имени при регистрации
    document.getElementById('showRegBtn').onclick = () => {
        document.getElementById('regNameBlock').style.display = 'block';
        document.getElementById('showRegBtn').style.display = 'none';
        document.getElementById('registerBtn').style.display = 'inline-block';
    };

    // Регистрация с именем
    document.getElementById('registerBtn').onclick = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const displayName = document.getElementById('regName').value;
        
        if (!displayName) {
            errorDiv.innerText = "Введите ваше имя!";
            return;
        }
        
        auth.createUserWithEmailAndPassword(email, pass)
            .then((userCredential) => userCredential.user.updateProfile({ displayName: displayName }))
            .then(() => {
                errorDiv.innerText = "✅ Успех! Теперь войдите";
                document.getElementById('regName').value = '';
document.getElementById('regNameBlock').style.display = 'none';
                document.getElementById('showRegBtn').style.display = 'inline-block';
                document.getElementById('registerBtn').style.display = 'none';
            })
            .catch(e => errorDiv.innerText = e.message);
    };

    // Вход
    document.getElementById('loginBtn').onclick = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, pass)
            .catch(e => errorDiv.innerText = e.message);
    };

    // Вход через Google
    // Это ВСЁ, что нужно для попапа
document.getElementById('googleBtn').onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider, firebase.auth.browserPopupRedirectResolver)
        .then((result) => {
            // Сюда попадёшь после успешного входа
            console.log("Успех!", result.user);
        })
        .catch((error) => {
            console.error("Ошибка:", error);
        });
};
// Обработка возврата после редиректа
auth.getRedirectResult().then((result) => {
    if (result.user) {
        // Вход успешен
        console.log("User:", result.user);
        errorDiv.innerText = "✅ Добро пожаловать!";
    }
}).catch((e) => {
    errorDiv.innerText = e.message;
});
    // Анонимный вход убран


    // Выход
    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    // Отправка сообщения с именем
    document.getElementById('sendBtn').onclick = () => {
        const user = auth.currentUser;
        if (user) {
            const text = document.getElementById('messageInput').value;
            if (text.trim()) {
                db.collection("messages").add({
                    text: text,
                    email: user.email,
                    displayName: user.displayName,
                    time: new Date()
                });
                document.getElementById('messageInput').value = '';
            }
        }
    };

    // Загрузка сообщений с именами
    auth.onAuthStateChanged(user => {
        if (user) {
            authDiv.style.display = 'none';
            chatDiv.style.display = 'block';
            
            db.collection("messages").orderBy("time").onSnapshot(snapshot => {
                const div = document.getElementById('messages');
                div.innerHTML = '';
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const senderName = m.displayName || m.email.split('@')[0];
                    div.innerHTML += `<div class="message"><b>${escapeHtml(senderName)}:</b> ${escapeHtml(m.text)}</div>`;
                });
            });
        } else {
            authDiv.style.display = 'block';
            chatDiv.style.display = 'none';
        }
    });

    // Защита от XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Кнопка скачивания .exe (заглушка)
    document.getElementById('downloadBtn').onclick = () => alert("Ссылка на .exe появится позже");
</script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
