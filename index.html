<!DOCTYPE html>
<html>
<head>
    <title>Мой чат</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #121212; color: white; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 10px; border: none; font-size: 16px; }
        input { background: #2a2a2a; color: white; }
        button { background: #3b82f6; color: white; cursor: pointer; }
        .message { background: #2a2a2a; margin: 8px 0; padding: 12px; border-radius: 12px; }
        #chat { display: none; }
        #error { color: #ff6b6b; margin-top: 10px; }
    </style>
</head>
<body>

<h1>💬  Мой чат</h1>
<button id="downloadBtn" style="background:#10b981;">📥 Скачать .exe</button>
<hr>

<div id="auth">
    <h3>Вход / Регистрация</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">
    <button id="registerBtn">Зарегистрироваться</button>
    <button id="loginBtn">Войти</button>
    <div id="error"></div>
</div>

<div id="chat">
    <button id="logoutBtn" style="background:#ef4444;">Выйти</button>
    <div id="messages" style="max-height: 400px; overflow-y: auto; margin: 20px 0;"></div>
    <input type="text" id="messageInput" placeholder="Сообщение...">
    <button id="sendBtn">Отправить</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
  apiKey: "AIzaSyBsS0KGNIdTvnJ36ud1lVjDRlEQF1UhZfA",
  authDomain: "my-akgo-chat.firebaseapp.com",
  databaseURL: "https://my-akgo-chat-default-rtdb.firebaseio.com",
  projectId: "my-akgo-chat",
  storageBucket: "my-akgo-chat.firebasestorage.app",
  messagingSenderId: "1041994309787",
  appId: "1:1041994309787:web:f984a589d23cc612c7a63e"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Элементы
    const authDiv = document.getElementById('auth');
    const chatDiv = document.getElementById('chat');
    const errorDiv = document.getElementById('error');
    const emailInp = document.getElementById('email');
    const passInp = document.getElementById('password');

    // Регистрация
    document.getElementById('registerBtn').onclick = () => {
        const email = emailInp.value;
        const pass = passInp.value;
        auth.createUserWithEmailAndPassword(email, pass)
            .then(() => errorDiv.innerText = "✅ Успех! Теперь войдите")
            .catch(e => errorDiv.innerText = e.message);
    };

    // Вход
    document.getElementById('loginBtn').onclick = () => {
        const email = emailInp.value;
        const pass = passInp.value;
        auth.signInWithEmailAndPassword(email, pass)
            .catch(e => errorDiv.innerText = e.message);
    };

    // Выход
    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    // Отправка сообщения
    document.getElementById('sendBtn').onclick = () => {
        const user = auth.currentUser;
        if (user) {
            const text = document.getElementById('messageInput').value;
            if (text.trim()) {
                db.collection("messages").add({
                    text: text,
                    email: user.email,
                    time: new Date()
                });
                document.getElementById('messageInput').value = '';
            }
        }
    };

    // Следим за входом/выходом
    auth.onAuthStateChanged(user => {
        if (user) {
            authDiv.style.display = 'none';
            chatDiv.style.display = 'block';
            
            db.collection("messages").orderBy("time").onSnapshot(snapshot => {
                const div = document.getElementById('messages');
div.innerHTML = '';
                snapshot.forEach(doc => {
                    const m = doc.data();
                    div.innerHTML += `<div class="message"><b>${m.email}:</b> ${m.text}</div>`;
                });
            });
        } else {
            authDiv.style.display = 'block';
            chatDiv.style.display = 'none';
        }
    });

    // Кнопка скачивания .exe
    document.getElementById('downloadBtn').onclick = () => alert("Ссылка на .exe появится позже");
</script>

</body>
</html>
